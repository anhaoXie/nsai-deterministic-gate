name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Coverage summary
        if: always() && matrix.java == '21'
        run: |
          csv=build/reports/jacoco/test/jacocoTestReport.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1 { im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9 }
              END {
                printf "## Test coverage\n\n| Metric | Covered |\n|---|---|\n"
                printf "| Lines | %.1f%% |\n", 100*lc/(lc+lm)
                printf "| Branches | %.1f%% |\n", (bc+bm) ? 100*bc/(bc+bm) : 0
                printf "| Instructions | %.1f%% |\n", 100*ic/(ic+im)
              }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 14

  local-mode-demo:
    name: Local mode demo (docker compose)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Build image and run demo
        run: docker compose run --rm -T --build nsai-demo | tee demo.log

      - name: Check demo verdicts
        run: |
          grep -q "^    ALLOWED" demo.log
          test "$(grep -c "^    BLOCKED" demo.log)" -eq 2
          grep -q "max-interest-rate" demo.log
          grep -q "no-guaranteed-approval" demo.log
