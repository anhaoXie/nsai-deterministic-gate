plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.durgaprasad'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Rule engine: parse JSON output from the LLM
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Graph mode: rules stored in Neo4j (the driver connects only when graph mode is used)
    implementation 'org.neo4j.driver:neo4j-java-driver'

    // Cache for rules loaded from Neo4j
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Real Neo4j in Docker for the graph-mode tests (skipped when Docker is not running)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:neo4j'

}

springBoot {
    mainClass = 'com.durgaprasad.nsai.NSAIDeterministcApplication'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')

    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        // Stream stdout so the cache benchmark trace is visible
        showStandardStreams = true
    }
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}
